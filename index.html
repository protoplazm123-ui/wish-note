<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>WISH NOTE ♡</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =========================
   ОСНОВА
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;

  background:
    linear-gradient(
      rgba(0, 0, 0, 0.45),
      rgba(0, 0, 0, 0.45)
    ),
    url("IMG_1023.jpeg")
    center center / cover fixed no-repeat;
}


/* =========================
   ПРИЛОЖЕНИЕ
========================= */

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;

  margin: 0 auto;

  padding: 28px 20px 50px;

  background: rgba(0, 0, 0, 0.25);

  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}


/* =========================
   СТРАНИЦЫ
========================= */

.page {
  display: none;
  animation: pageAppear 0.45s ease;
}

.page.active {
  display: block;
}

@keyframes pageAppear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}


/* =========================
   ДЕКОР
========================= */

.decor {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.9;
}

.decor.one {
  top: 30px;
  left: 15px;
  font-size: 28px;
}

.decor.two {
  top: 110px;
  right: 18px;
  font-size: 25px;
}

.decor.three {
  bottom: 70px;
  left: 18px;
  font-size: 22px;
}

.decor.four {
  bottom: 120px;
  right: 20px;
  font-size: 25px;
}


/* =========================
   ПЕРВАЯ СТРАНИЦА
========================= */

.intro {
  position: relative;
  z-index: 2;

  min-height: calc(100vh - 78px);

  display: flex;
  flex-direction: column;
  justify-content: center;

  text-align: center;
}

.intro-photo {
  width: 145px;
  height: 145px;

  margin: 0 auto 25px;

  border-radius: 50%;

  background:
    url("IMG_1024.jpeg")
    center / cover;

  border: 5px solid rgba(255,255,255,0.85);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.3);

  animation: photoFloat 4s ease-in-out infinite;
}

@keyframes photoFloat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-6px);
  }
}

.logo {
  margin: 0;

  font-size: 48px;
  line-height: 0.95;

  font-weight: 900;

  letter-spacing: -2px;

  color: #fff;

  text-shadow:
    0 4px 18px rgba(0,0,0,0.35);
}

.intro-title {
  margin-top: 18px;

  font-size: 23px;
  font-weight: 800;

  line-height: 1.2;
}

.intro-text {
  max-width: 390px;

  margin: 18px auto 0;

  font-size: 15px;
  line-height: 1.65;

  font-weight: 500;

  text-shadow:
    0 2px 10px rgba(0,0,0,0.35);
}

.date-range {
  margin-top: 25px;

  font-size: 12px;
  font-weight: 800;

  letter-spacing: 3px;

  opacity: 0.95;
}

.days-title {
  margin-top: 8px;

  font-size: 16px;
  font-weight: 900;

  letter-spacing: 3px;

  animation: softPulse 3s ease-in-out infinite;
}

@keyframes softPulse {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: 0.7;
  }
}

.love {
  margin-top: 25px;

  font-size: 15px;
  font-weight: 700;
}


/* =========================
   КНОПКИ
========================= */

.main-button {
  width: 100%;

  margin-top: 25px;

  padding: 17px 20px;

  border: none;
  border-radius: 18px;

  background: rgba(255,255,255,0.92);

  color: #555;

  font-size: 14px;
  font-weight: 900;

  letter-spacing: 1px;

  cursor: pointer;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.2);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.main-button:active {
  transform: scale(0.97);
}

.main-button:disabled {
  opacity: 0.6;
}


/* =========================
   КАЛЕНДАРЬ
========================= */

.calendar-header {
  text-align: center;

  margin-top: 10px;
  margin-bottom: 25px;
}

.calendar-small-title {
  font-size: 12px;
  font-weight: 800;

  letter-spacing: 3px;

  opacity: 0.8;
}

.calendar-title {
  margin-top: 7px;

  font-size: 30px;
  font-weight: 900;

  letter-spacing: -1px;
}

.calendar-range {
  margin-top: 7px;

  font-size: 11px;
  letter-spacing: 2px;

  opacity: 0.75;
}

.month-navigation {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 15px;
}

.month-name {
  font-size: 18px;
  font-weight: 900;
}

.nav-button {
  width: 40px;
  height: 40px;

  border: none;
  border-radius: 50%;

  background: rgba(255,255,255,0.2);

  color: white;

  font-size: 20px;

  cursor: pointer;
}

   ДНИ НЕДЕЛИ
========================= */

.weekdays,
.calendar-grid {
  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  gap: 7px;
}
