<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>WISH NOTE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0c0b;
      color: #eee7dc;
      font-family: Georgia, "Times New Roman", serif;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 20px 40px;
      background:
        radial-gradient(
          circle at 50% 0%,
          #321b1d 0%,
          #171312 35%,
          #0d0c0b 75%
        );
    }

    /* Верхняя строка */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: #8d847b;
    }

    /* Заголовок */

    .logo {
      margin-top: 62px;
      margin-bottom: 8px;

      font-size: 42px;
      line-height: 1;
      letter-spacing: 5px;
      font-weight: normal;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: #8e867d;
    }

    /* Текст */

    .intro {
      margin-top: 58px;
      margin-bottom: 30px;

      font-size: 23px;
      line-height: 1.35;
    }

    .intro span {
      color: #a94a4d;
      font-style: italic;
    }

    /* Категории */

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category {
      min-height: 135px;

      padding: 20px 16px;

      background: rgba(27, 24, 22, 0.92);

      border: 1px solid #39312d;
      border-radius: 2px;

      color: #eee7dc;
      text-align: left;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .category:active {
      transform: scale(0.97);
      background: #29201f;
    }

    .icon {
      display: block;
      margin-bottom: 25px;
      font-size: 25px;
    }

    .category-name {
      font-size: 16px;
      line-height: 1.2;
    }

    .category-description {
      margin-top: 7px;

      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      color: #756d66;
    }

    /* Кнопка */

    .wish-button {
      width: 100%;
      margin-top: 25px;
      padding: 18px;

      background: #70282b;
      border: none;

      color: #fff3e8;

      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;

      transition: transform 0.2s ease;
    }

    .wish-button:active {
      transform: scale(0.98);
    }

    /* Низ */

    .footer {
      margin-top: 35px;

      text-align: center;

      font-family: Arial, sans-serif;
      font-size: 8px;
      letter-spacing: 2px;

      color: #5f5852;
    }

    /* Экран написания желания */

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .back {
      margin: 0;
      padding: 0;

      background: none;
      border: none;

      color: #9d948a;

      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
    }

    .paper {
      margin-top: 35px;
      padding: 28px 22px 25px;

      min-height: 420px;

      background: #e8dfd0;
      color: #171414;

      box-shadow: 0 15px 40px rgba(0,0,0,0.45);

      transform: rotate(-0.4deg);
    }

    .paper-icon {
      font-size: 27px;
    }

    .paper h2 {
      margin: 10px 0 8px;

      font-size: 27px;
      font-weight: normal;
    }

    .paper-description {
      font-family: Arial, sans-serif;
      font-size: 10px;
      line-height: 1.5;

      color: #756b61;
    }

    textarea {
      width: 100%;
      height: 190px;

      margin-top: 20px;
      padding: 10px 0;

      resize: none;

      border: none;
      border-bottom: 1px solid #aaa095;

      outline: none;

      background: transparent;

      color: #171414;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
    }

    textarea::placeholder {
      color: #9d9388;
    }

    .seal-button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;

      background: #171414;
      border: none;

      color: #eee5d9;

      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
    }

    /* Экран после отправки */

    .success {
      display: none;
      text-align: center;
      padding-top: 150px;
    }

    .success.active {
      display: block;
    }

    .success-symbol {
      font-size: 40px;
      margin-bottom: 25px;
    }

    .success h2 {
      font-size: 27px;
      font-weight: normal;
    }

    .success p {
      margin-top: 15px;

      font-family: Arial, sans-serif;
      font-size: 10px;
      line-height: 1.6;

      color: #8d847b;
    }

    .home-button {
      margin-top: 30px;
      padding: 15px 25px;

      background: transparent;
      border: 1px solid #514742;

      color: #d8cec1;

      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- ГЛАВНЫЙ ЭКРАН -->

    <section id="homeScreen" class="screen active">

      <div class="top">
        <span>PRIVATE EDITION</span>
        <span>№ 365</span>
      </div>

      <h1 class="logo">
        WISH NOTE
      </h1>

      <div class="subtitle">
        365 WISHES · 365 DAYS
      </div>

      <div class="intro">
        Напиши желание.<br>
        <span>Остальное — тайна.</span>
      </div>


      <div class="categories">

        <button
          class="category"
          onclick="openWish('🔥', '18+')"
        >
          <span class="icon">🔥</span>

          <div class="category-name">
            18+
          </div>

          <div class="category-description">
            ТОЛЬКО ДЛЯ НАС
          </div>
        </button>


        <button
          class="category"
          onclick="openWish('🍓', 'Вкусности')"
        >
          <span class="icon">🍓</span>

          <div class="category-name">
            Вкусности
          </div>

          <div class="category-description">
            ХОЧУ ПОПРОБОВАТЬ
          </div>
        </button>


        <button
          class="category"
          onclick="openWish('🎬', 'Досуг')"
        >
          <span class="icon">🎬</span>

          <div class="category-name">
            Досуг
          </div>

          <div class="category-description">
            КУДА ПОЙДЁМ
          </div>
        </button>


        <button
          class="category"
          onclick="openWish('🖤', 'Игра на честность')"
        >
          <span class="icon">🖤</span>

          <div class="category-name">
            Игра на честность
          </div>

          <div class="category-description">
            БЕЗ ФИЛЬТРОВ
          </div>
        </button>

      </div>


      <button
        class="wish-button"
        onclick="openWish('✦', 'Твоё желание')"
      >
        + ЗАГАДАТЬ ЖЕЛАНИЕ
      </button>


      <div class="footer">
        A PRIVATE GAME FOR TWO
      </div>

    </section>



    <!-- ЭКРАН НАПИСАНИЯ ЖЕЛАНИЯ -->

    <section id="wishScreen" class="screen">

      <button
        class="back"
        onclick="goHome()"
      >
        ← НАЗАД
      </button>


      <div class="paper">

        <div
          id="wishIcon"
          class="paper-icon"
        >
          ✦
        </div>


        <h2 id="wishTitle">
          Твоё желание
        </h2>


        <div class="paper-description">
          Напиши его так, как ты действительно хочешь.
        </div>


        <textarea
          id="wishText"
          placeholder="Моё желание..."
        ></textarea>


        <button
          class="seal-button"
          onclick="sealWish()"
        >
          ЗАПЕЧАТАТЬ ЖЕЛАНИЕ
        </button>

      </div>


      <div class="footer">
        ПОСЛЕ ОТПРАВКИ ЖЕЛАНИЕ СТАНЕТ ТАЙНЫМ
      </div>

    </section>



    <!-- ЭКРАН ПОСЛЕ ОТПРАВКИ -->

    <section
      id="successScreen"
      class="success"
    >

      <div class="success-symbol">
        ✦
      </div>

      <h2>
        Желание запечатано
      </h2>

      <p>
        Оно отправлено тому,<br>
        кто должен его исполнить.
      </p>

      <button
        class="home-button"
        onclick="goHome()"
      >
        ВЕРНУТЬСЯ
      </button>

    </section>

  </main>


  <script>

    function openWish(icon, title) {

      document
        .getElementById("homeScreen")
        .classList.remove("active");

      document
        .getElementById("successScreen")
        .classList.remove("active");

      document
        .getElementById("wishScreen")
        .classList.add("active");


      document
        .getElementById("wishIcon")
        .textContent = icon;


      document
        .getElementById("wishTitle")
        .textContent = title;


      document
        .getElementById("wishText")
        .value = "";


      document
        .getElementById("wishText")
        .focus();
    }


    function sealWish() {

      const wish =
        document
          .getElementById("wishText")
          .value
          .trim();


      if (!wish) {

        alert("Сначала напиши желание ✦");

        return;
      }


      document
        .getElementById("wishScreen")
        .classList.remove("active");


      document
        .getElementById("successScreen")
        .classList.add("active");


      /*
        ПОЗЖЕ ЗДЕСЬ МЫ ДОБАВИМ ОТПРАВКУ
        ЖЕЛАНИЯ В ТВОЙ TELEGRAM.
      */

    }


    function goHome() {

      document
        .getElementById("wishScreen")
        .classList.remove("active");

      document
        .getElementById("successScreen")
        .classList.remove("active");

      document
        .getElementById("homeScreen")
        .classList.add("active");

    }

  </script>

</body>
</html>
